# Nightfall: Secret Roles — CI
# Generated by the dreamcrafters CI kit. Edit the toggles below instead of the steps.
#
# Every step is switchable WITHOUT a commit: GitHub → repo → Settings →
# Secrets and variables → Actions → Variables tab → New repository variable.
#   CI_RUN_LINT       default false  (lint runs locally in `make build` + the pre-push hook)
#   CI_RUN_TYPECHECK  default true
#   CI_RUN_TESTS      default true
#   CI_RUN_I18N       default true   (translation key parity)
#   CI_I18N_STRICT    default false  (true = missing translations fail the run)
#   CI_RUN_SECURITY   default true   (gitleaks + npm audit)
#   CI_RUN_SEMGREP    default false
# No agentic / AI steps and no EAS build here — builds live in release.yml (manual only).

name: "Nightfall: Secret Roles — CI"

on:
  push:
    branches: [main]
    paths-ignore: ["**/*.md", "docs/**", "LICENSE", ".githooks/**", "Makefile"]
  pull_request:
    branches: [main]
    paths-ignore: ["**/*.md", "docs/**", "LICENSE", ".githooks/**", "Makefile"]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: "22"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  RUN_LINT: ${{ vars.CI_RUN_LINT || 'false' }}
  RUN_TYPECHECK: ${{ vars.CI_RUN_TYPECHECK || 'true' }}
  RUN_TESTS: ${{ vars.CI_RUN_TESTS || 'true' }}
  RUN_I18N: ${{ vars.CI_RUN_I18N || 'true' }}
  I18N_STRICT: ${{ vars.CI_I18N_STRICT || 'false' }}
  RUN_SECURITY: ${{ vars.CI_RUN_SECURITY || 'true' }}
  RUN_SEMGREP: ${{ vars.CI_RUN_SEMGREP || 'false' }}

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: ${{ env.RUN_SECURITY == 'true' && '0' || '1' }}

      - name: Setup Node ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Validate Expo config
        run: npx expo config --type public > /dev/null

      - name: Lint
        if: env.RUN_LINT == 'true'
        run: npm run lint

      - name: Unit tests
        if: env.RUN_TESTS == 'true'
        run: npm test

      - name: Resolve Gitleaks base ref
        if: env.RUN_SECURITY == 'true' && github.event_name == 'push'
        shell: bash
        run: |
          BASE_REF="${{ github.event.before }}"
          if [ -n "$BASE_REF" ] && git rev-parse --verify --quiet "$BASE_REF^{commit}" >/dev/null; then
            echo "BASE_REF=$BASE_REF" >> "$GITHUB_ENV"
          else
            echo "BASE_REF=${GITHUB_SHA}" >> "$GITHUB_ENV"
          fi

      - name: Gitleaks — secret scan
        if: env.RUN_SECURITY == 'true'
        uses: gitleaks/gitleaks-action@v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
          BASE_REF: ${{ env.BASE_REF }}

      - name: npm audit (runtime deps, high+)
        if: env.RUN_SECURITY == 'true'
        run: npm audit --audit-level=high --omit=dev

      - name: Semgrep CE
        if: env.RUN_SEMGREP == 'true'
        uses: semgrep/semgrep-action@v1
        with:
          config: >-
            p/react
            p/javascript
            p/secrets
        env:
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}
        continue-on-error: true
