# Nightfall: Secret Roles — EAS build & store submit
# Generated by the dreamcrafters CI kit. MANUAL ONLY: Actions tab → "Nightfall: Secret Roles — EAS release" → Run workflow.
#
# Nothing here runs on push, so EAS build quota and store uploads are never spent by accident.
# The build runs on EAS servers (--no-wait), so the GitHub runner exits in ~2-3 minutes.
# "submit" sends a production build to Google Play's INTERNAL track as a DRAFT (see eas.json →
# submit.production). Promoting to production is always a human click in Play Console.
#
# Needs (one-time, see AGENTS.md → "Release checklist"):
#   secret  EXPO_TOKEN                       — expo.dev → Account settings → Access tokens
#   app.json expo.extra.eas.projectId        — written by `npx eas-cli init`
#   Play service-account key uploaded to EAS — `npx eas-cli credentials` (only for submit)

name: "Nightfall: Secret Roles — EAS release"

on:
  workflow_dispatch:
    inputs:
      platform:
        description: "Platform"
        type: choice
        options: [android, ios, all]
        default: android
      profile:
        description: "EAS build profile (eas.json)"
        type: choice
        options: [development, preview, production]
        default: production
      submit:
        description: "Auto-submit after build (production profiles only → Play internal track, draft)"
        type: boolean
        default: false
      run_tests:
        description: "Run typecheck + unit tests first"
        type: boolean
        default: true
      run_lint:
        description: "Run lint first (normally already done locally)"
        type: boolean
        default: false

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  NODE_VERSION: "22"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  eas:
    name: EAS ${{ inputs.profile }} (${{ inputs.platform }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check EXPO_TOKEN is set
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::Repository secret EXPO_TOKEN is missing. Create one at expo.dev → Account settings → Access tokens, then add it under Settings → Secrets and variables → Actions."
            exit 1
          fi

      - name: Refuse submit for non-store profiles
        if: inputs.submit && !startsWith(inputs.profile, 'production')
        run: |
          echo "::error::Submit is only allowed with a production* profile (got '${{ inputs.profile }}')."
          exit 1

      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check EAS project is linked
        run: |
          npx expo config --json --type public > /tmp/expo-config.json
          node -e '
            const c = require("/tmp/expo-config.json");
            const id = c.extra && c.extra.eas && c.extra.eas.projectId;
            if (!/^[0-9a-f-]{36}$/i.test(id || "")) {
              console.log("::error::No EAS projectId in app config. Run \"npx eas-cli init\" once locally and commit app.json.");
              process.exit(1);
            }
            console.log("EAS project " + id + " — " + c.name + " " + c.version);
          '

      - name: Lint
        if: inputs.run_lint
        run: npm run lint

      - name: Unit tests
        if: inputs.run_tests
        run: npm test

      - name: Setup EAS CLI
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: EAS build${{ inputs.submit && ' + submit' || '' }}
        run: |
          SUBMIT=""
          if [ "${{ inputs.submit }}" = "true" ]; then SUBMIT="--auto-submit-with-profile production"; fi
          eas build --platform "${{ inputs.platform }}" --profile "${{ inputs.profile }}" \
            --non-interactive --no-wait $SUBMIT \
            --message "${{ github.sha }} via GitHub Actions"
          {
            echo "### EAS build queued"
            echo "- profile: \`${{ inputs.profile }}\` · platform: \`${{ inputs.platform }}\` · submit: \`${{ inputs.submit }}\`"
            echo "- commit: \`${{ github.sha }}\`"
            echo "- follow it at https://expo.dev (Builds tab of this project)"
          } >> "$GITHUB_STEP_SUMMARY"
